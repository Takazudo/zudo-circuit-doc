# Publish create-zudo-circuit-doc to npm from its stable
# create-zudo-circuit-doc-vX.Y.Z tag.

name: Publish create-zudo-circuit-doc to npm

on:
  push:
    tags:
      - "create-zudo-circuit-doc-v*.*.*"
  workflow_dispatch:

concurrency:
  group: publish-create-zudo-circuit-doc
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build, verify, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Setup
        uses: ./.github/actions/setup

      - name: Setup Node.js for npm publish
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Guard stable initializer release tag
        run: node scripts/lib/release-guard.mjs initializer

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Check initializer template
        run: pnpm check:template

      - name: Build documentation and check generated changelogs
        run: |
          pnpm doc:build
          git diff --exit-code -- packages/circuit-doc/CHANGELOG.md packages/create-zudo-circuit-doc/CHANGELOG.md

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify with published runtime
        run: pnpm verify:pack --fixture empty --published-runtime

      # npm staged publishing: NPM_TOKEN is a stage-only token, so this job
      # uploads a pending stage and a maintainer promotes it to `latest` with
      # `npm stage approve <stage-id> --otp <code>`. Staging needs npm >= 11.15.0
      # and only works for a package that already exists on npm (the first
      # version is published directly by a maintainer). See dev-docs/publishing.md.
      - name: Install npm with staged publishing
        run: npm install -g npm@11.20.0

      - name: Stage package for approval
        working-directory: packages/create-zudo-circuit-doc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm stage publish --tag latest --access public --provenance
