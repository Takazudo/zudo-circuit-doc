# Publish create-zudo-circuit-doc to npm from its stable
# create-zudo-circuit-doc-vX.Y.Z tag.

name: Publish create-zudo-circuit-doc to npm

on:
  push:
    tags:
      - "create-zudo-circuit-doc-v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish (leave empty to use the dispatch ref)"
        type: string
        required: false

concurrency:
  group: publish-create-zudo-circuit-doc
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build, verify, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup
        uses: ./.github/actions/setup

      - name: Setup Node.js for npm publish
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Guard stable initializer release tag
        env:
          RELEASE_REF_TYPE: ${{ inputs.tag && 'tag' || github.ref_type }}
          RELEASE_REF_NAME: ${{ inputs.tag || github.ref_name }}
        run: node scripts/lib/release-guard.mjs initializer

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Check initializer template
        run: pnpm check:template

      - name: Build documentation and check generated changelogs
        run: |
          pnpm doc:build
          git diff --exit-code -- packages/circuit-doc/CHANGELOG.md packages/create-zudo-circuit-doc/CHANGELOG.md

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify with published runtime
        run: pnpm verify:pack --fixture empty --published-runtime

      # Direct CI publishing: NPM_TOKEN is a granular token with publish
      # permission that bypasses 2FA, so pushing the release tag is the
      # human gate. See dev-docs/publishing.md.
      - name: Publish package
        working-directory: packages/create-zudo-circuit-doc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm publish --tag latest --access public --no-git-checks --provenance
