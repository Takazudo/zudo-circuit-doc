# Publish @takazudo/zudo-circuit-doc to npm from its stable vX.Y.Z tag with
# npm Trusted Publishing (GitHub OIDC). No stored npm credential is used.
# Procedure, recovery and owner setup: dev-docs/publishing.md.
#
# Jobs and their only permissions:
#   admit    contents:read          prove the tag exists, bind source commit,
#                                   version and exact npm state; pick a mode
#   verify   contents:read          every release gate on the tag commit, then
#                                   pack the tarball (dry-run stops here)
#   publish  contents:read,         publish exactly the verified tarball; no
#            id-token:write         dependency install runs in this job
#   confirm  contents:read          prove an OIDC upload with provenance for the
#                                   tag commit (not just "the version exists")
#   finalize contents:write         create the GitHub Release if missing; never
#                                   publishes, never rewrites an existing one
#
# Provenance attests the run's own commit, so a publish is admitted only when
# the run's ref is the tag itself (tag push, or dispatch --ref <tag>). A run
# dispatched from main for an older tag can dry-run or finalize, not publish.

name: Publish zudo-circuit-doc to npm

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Exact existing release tag (vX.Y.Z). Dispatch with --ref set to the same tag to publish."
        type: string
        required: true
      dry_run:
        description: "Run admission and every gate, pack, and stop (no publish, no GitHub Release)."
        type: boolean
        default: false

concurrency:
  group: publish-zudo-circuit-doc
  cancel-in-progress: false

permissions: {}

jobs:
  admit:
    name: Admit release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.admit.outputs.tag }}
      version: ${{ steps.admit.outputs.version }}
      source_sha: ${{ steps.admit.outputs.source_sha }}
      mode: ${{ steps.admit.outputs.mode }}
    steps:
      - name: Checkout control commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Admit tag, source and npm state
        id: admit
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: node scripts/release.mjs admit --package runtime

  verify:
    name: Verify and pack
    needs: admit
    if: needs.admit.outputs.mode == 'publish' || needs.admit.outputs.mode == 'dry-run'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
      integrity: ${{ steps.pack.outputs.integrity }}
    env:
      SOURCE_SHA: ${{ needs.admit.outputs.source_sha }}
      VERSION: ${{ needs.admit.outputs.version }}
    steps:
      - name: Checkout tag commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          ref: ${{ needs.admit.outputs.source_sha }}
          persist-credentials: false

      - name: Confirm checkout is the admitted source
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Check initializer template
        run: pnpm check:template

      - name: Check runtime package shape
        run: pnpm --filter @takazudo/zudo-circuit-doc check:shape

      - name: Build documentation and check generated changelogs
        run: |
          pnpm doc:build
          git diff --exit-code -- packages/circuit-doc/CHANGELOG.md packages/create-zudo-circuit-doc/CHANGELOG.md

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify empty consumer
        run: pnpm verify:pack --fixture empty

      - name: Verify minimal consumer
        run: pnpm verify:pack --fixture minimal

      # pnpm pack rewrites workspace: ranges; tarball-info rejects any left over.
      - name: Pack release tarball
        id: pack
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          pnpm --filter @takazudo/zudo-circuit-doc pack --pack-destination "$RUNNER_TEMP/release"
          node scripts/release.mjs tarball-info --package runtime --version "$VERSION" --tarball "$(ls "$RUNNER_TEMP"/release/*.tgz)"

      # No id-token in this job, so this cannot authenticate or write.
      - name: Publish dry-run
        env:
          TARBALL: ${{ runner.temp }}/release/${{ steps.pack.outputs.tarball }}
        run: pnpm publish "$TARBALL" --dry-run --tag latest --access public --no-git-checks

      - name: Upload verified tarball
        if: needs.admit.outputs.mode == 'publish'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-tarball
          path: ${{ runner.temp }}/release/${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish with OIDC
    needs: [admit, verify]
    if: needs.admit.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      TARBALL: ${{ runner.temp }}/release/${{ needs.verify.outputs.tarball }}
    steps:
      - name: Checkout tag commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          ref: ${{ needs.admit.outputs.source_sha }}
          persist-credentials: false

      # pnpm (packageManager) publishes natively and performs the npm OIDC
      # exchange itself; no `pnpm install` runs in this id-token job.
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          dest: ~/setup-pnpm-publish

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Download verified tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-tarball
          path: ${{ runner.temp }}/release

      - name: Publish preflight
        env:
          INTEGRITY: ${{ needs.verify.outputs.integrity }}
        run: |
          echo "Publishing executable: $(command -v pnpm) $(pnpm --version)"
          node scripts/release.mjs publish-preflight --tarball "$TARBALL" --integrity "$INTEGRITY"

      - name: Publish package
        run: pnpm publish "$TARBALL" --tag latest --access public --no-git-checks --provenance

  confirm:
    name: Confirm OIDC publication
    needs: [admit, verify, publish]
    if: needs.admit.outputs.mode == 'publish' && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout control commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Verify trusted publisher and provenance source
        env:
          VERSION: ${{ needs.admit.outputs.version }}
          TAG: ${{ needs.admit.outputs.tag }}
          SOURCE_SHA: ${{ needs.admit.outputs.source_sha }}
          INTEGRITY: ${{ needs.verify.outputs.integrity }}
        run: >-
          node scripts/release.mjs verify-publication --package runtime
          --version "$VERSION" --tag "$TAG" --source-sha "$SOURCE_SHA" --integrity "$INTEGRITY"

  finalize:
    name: Finalize GitHub Release
    needs: [admit, publish]
    if: >-
      always() && (needs.admit.outputs.mode == 'finalize' ||
      (needs.admit.outputs.mode == 'publish' && needs.publish.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout control commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Create GitHub Release if missing
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.admit.outputs.version }}
          SOURCE_SHA: ${{ needs.admit.outputs.source_sha }}
        run: node scripts/release.mjs finalize --package runtime --version "$VERSION" --source-sha "$SOURCE_SHA"
