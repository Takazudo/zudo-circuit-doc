# Python validator gate: the stdlib-only circuit_evidence package and its tests.
#
# Triggered on PRs targeting `main` or any `base/**` branch (epic-PR stacks),
# and on push to `main`. Python 3.10 is the declared floor (ADR-003); 3.12 is
# the upstream zudo-led-lamp CI version.

name: CI Python

on:
  pull_request:
    branches:
      - main
      - "base/**"
  push:
    branches:
      - main

concurrency:
  group: ci-python-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-unit:
    name: Python Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run Python unit tests
        run: pnpm test:python
