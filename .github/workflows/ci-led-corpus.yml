# LED-corpus TypeScript test suite gate (#26).
#
# Own workflow file, deliberately separate from `ci-led-fixture.yml` (#21/#23)
# so the two never collide on the same file. Restores the STEP cache
# (materializing on a cache miss, same cache key as `ci-led-fixture.yml`),
# builds the packaged engine, then runs the LED-corpus suite under
# `packages/circuit-doc/test-led/**` — the real corpus, the real reference
# contract, and the real Python validator, all against the pinned,
# hash-locked fixture.
#
# Triggered on PRs targeting `main` or any `base/**` branch (epic-PR stacks),
# and on push to `main`, same as the fixture regression gate.

name: CI LED Corpus

on:
  pull_request:
    branches:
      - main
      - "base/**"
  push:
    branches:
      - main

concurrency:
  group: ci-led-corpus-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-led-corpus:
    name: LED Corpus Suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Setup
        uses: ./.github/actions/setup

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Same cache key as `ci-led-fixture.yml`: the 25 STEP files never change
      # unless the pinned zudo-led-lamp commit (fixtures/led/README.md) moves.
      - name: Cache LED STEP files
        id: step-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: fixtures/led/upstream/footprints/kicad/zudo-led-lamp.3dshapes/*.step
          key: led-step-194d8a297e3545588197342130c3111a66c10973

      - name: Materialize STEP (cache miss)
        if: steps.step-cache.outputs.cache-hit != 'true'
        run: pnpm fixtures:led:materialize

      - name: Build
        run: pnpm build

      - name: LED-corpus test suite
        run: pnpm --filter @takazudo/zudo-circuit-doc test:led-corpus
