# fixtures/led regression gate.
#
# Triggered on PRs targeting `main` or any `base/**` branch (epic-PR stacks),
# and on push to `main`.
#
# Jobs:
#   lock-check  — pnpm fixtures:led:check (offline, no network, no Python)
#   oracle      — pnpm fixtures:led:oracle: the pinned upstream validator, its
#                 unit tests and the forward-test checker, unmodified. Never
#                 reads STEP, so no materialization step is needed here.
#   regression  — node scripts/check-led-fixture.mjs: the PACKAGED engine,
#                 driven only by fixtures/led/circuit.config.ts, reproduces
#                 the pinned LED goldens byte for byte (#21, M2 acceptance).
#                 STEP is cached by the pinned upstream commit SHA and
#                 materialized on a cache miss.
#   site        — pnpm build:led-site (#23): a real zfb build of a standalone
#                 zudo-doc site from a PACKED @takazudo/zudo-circuit-doc
#                 tarball at LED scale (35 records, 25 footprint SVGs, 25
#                 WRLs), then check-built + scan + strict check-links against
#                 the re-baselined fixture-site scan policy. The built dist is
#                 uploaded as an artifact for #27's browser smoke.

name: CI LED Fixture

on:
  pull_request:
    branches:
      - main
      - "base/**"
  push:
    branches:
      - main

concurrency:
  group: ci-led-fixture-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lock-check:
    name: Lock Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Setup
        uses: ./.github/actions/setup

      - name: fixtures:led:check
        run: pnpm fixtures:led:check

  oracle:
    name: Oracle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Setup
        uses: ./.github/actions/setup

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: fixtures:led:oracle
        run: pnpm fixtures:led:oracle

  regression:
    name: Regression (packaged engine)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Setup
        uses: ./.github/actions/setup

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Keyed on the pinned zudo-led-lamp commit (fixtures/led/README.md), not
      # a lockfile hash: the 25 STEP files never change unless that pin moves.
      - name: Cache LED STEP files
        id: step-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: fixtures/led/upstream/footprints/kicad/zudo-led-lamp.3dshapes/*.step
          key: led-step-194d8a297e3545588197342130c3111a66c10973

      - name: Materialize STEP (cache miss)
        if: steps.step-cache.outputs.cache-hit != 'true'
        run: pnpm fixtures:led:materialize

      - name: Build
        run: pnpm build

      - name: fixtures/led regression
        run: node scripts/check-led-fixture.mjs

  site:
    name: Fixture Site (packed engine)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Setup
        uses: ./.github/actions/setup

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Same cache key as the `regression` job above — both jobs need the
      # exact same pinned STEP files.
      - name: Cache LED STEP files
        id: step-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: fixtures/led/upstream/footprints/kicad/zudo-led-lamp.3dshapes/*.step
          key: led-step-194d8a297e3545588197342130c3111a66c10973

      - name: Materialize STEP (cache miss)
        if: steps.step-cache.outputs.cache-hit != 'true'
        run: pnpm fixtures:led:materialize

      - name: Build packages
        run: pnpm build

      # --out + --keep: the default (mkdtemp, auto-cleanup) leaves nothing to
      # upload, so CI pins the fixture site to a known runner-temp directory.
      - name: Build LED fixture site
        run: node scripts/build-fixture-site.mjs --fixture led --out ${{ runner.temp }}/led-fixture-site --keep

      - name: Upload built site
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: led-fixture-site-dist
          path: ${{ runner.temp }}/led-fixture-site/doc/dist
          retention-days: 7
