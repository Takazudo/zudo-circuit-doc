# This repo's own documentation site build gate.
#
# Full history is fetched (fetch-depth: 0) so zudo-doc's docHistory feature
# does not log git errors from a shallow clone.
#
# check-docs-cli.mjs diffs the reference/cli.mdx page against the real CLI
# --help output, so it needs packages/circuit-doc built first (#33: this was
# a script that existed but no workflow ran it, so the reference page could
# drift from the CLI silently).

name: CI Docs

on:
  pull_request:
    branches:
      - main
      - "base/**"
  push:
    branches:
      - main

concurrency:
  group: ci-docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  doc-build:
    name: Build Doc Site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build circuit-doc CLI
        run: pnpm --filter @takazudo/zudo-circuit-doc build

      - name: Check CLI reference page matches the built CLI
        run: node scripts/check-docs-cli.mjs

      - name: Build doc site
        run: pnpm doc:build
